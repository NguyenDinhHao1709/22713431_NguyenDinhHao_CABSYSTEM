openapi: 3.0.3
info:
  title: CAB System - Operator API Specification
  description: |
    Đặc tả API dành riêng cho phân hệ **Nhân viên Vận hành & Điều hành (Operator)** của hệ thống Đặt xe trực tuyến CAB System.
    Ánh xạ đầy đủ các yêu cầu từ tài liệu SRS:
    - **Business Requirements (BR):** BR_04 (Nâng cao năng lực giám sát & vận hành tập trung), BR_05 (Phân quyền RBAC chặt chẽ), BR_08 (Tính sẵn sàng cao & cô lập lỗi), BR_10 (Nhật ký kiểm toán Audit Log & bảo mật).
    - **Service Requirements (SR):** SR_02 (Xác thực JWT Role OPERATOR), SR_14 (Tra cứu chi tiết chuyến đi), SR_23 (Giám sát bản đồ vận hành trực tiếp), SR_24 (Phát hiện & xử lý sự cố cuốc xe), SR_25 (Tự động ghi nhận Audit Log).
    - **Use Cases (UC):** UC-10 (Giám sát bản đồ vận hành thời gian thực), UC-11 (Can thiệp xử lý sự cố cuốc xe).
    - **Business Rules (BRULE):** BRULE_10 (Ràng buộc kiểm toán: bắt buộc nhập lý do tối thiểu 10 ký tự cho mọi thao tác can thiệp như Force Cancel hay Reassign Driver để ghi vào `AUDIT_LOGS` bất biến).
  version: 1.0.0
  contact:
    name: Nguyễn Đình Hảo (MSSV: 22713431)
    url: https://github.com/NguyenDinhHao1709/22713431_NguyenDinhHao_CABSYSTEM.git

servers:
  - url: https://api.cabsystem.vn/api/v1/operator
    description: Production Server
  - url: http://localhost:8080/api/v1/operator
    description: Local Development & Sandbox Server

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Đăng nhập Cổng điều hành và lấy thông tin phiên làm việc của Operator (SR_02)
  - name: Live Operations Map
    description: Giám sát trực quan toàn bộ đội xe và các chuyến đi đang hoạt động trên bản đồ số (SR_23, UC-10)
  - name: Incident Management & Intervention
    description: Tiếp nhận cảnh báo sự cố bất thường và thực hiện can thiệp khẩn cấp (SR_24, UC-11, BRULE_10)
  - name: Trip Inspection & Support
    description: Tra cứu dữ liệu chi tiết chuyến xe phục vụ hỗ trợ khách hàng và tài xế (SR_14)

paths:
  # =========================================================================
  # AUTHENTICATION
  # =========================================================================
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Đăng nhập Cổng Điều hành Vận hành (SR_02)
      description: Xác thực tài khoản nhân viên vận hành (Role OPERATOR), cấp JWT Access Token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email_or_phone
                - password
              properties:
                email_or_phone:
                  type: string
                  example: "operator01@cabsystem.vn"
                password:
                  type: string
                  format: password
                  example: "Operator@Secure2026"
      responses:
        '200':
          description: Đăng nhập thành công, trả về Access Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorAuthTokenResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Tài khoản không có quyền truy cập Cổng Điều hành (Không phải OPERATOR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me:
    get:
      tags:
        - Authentication
      summary: Lấy thông tin tài khoản phiên làm việc của Operator
      responses:
        '200':
          description: Thông tin nhân viên vận hành
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # =========================================================================
  # LIVE OPERATIONS MAP
  # =========================================================================
  /live-map/drivers:
    get:
      tags:
        - Live Operations Map
      summary: Lấy danh sách và vị trí đội xe trên bản đồ số (SR_23, UC-10)
      description: |
        Truy vấn toàn bộ tài xế đang `ONLINE` hoặc `BUSY` trong khu vực địa lý (Bounding Box).
        Dữ liệu được trích xuất từ Redis Cache thời gian thực với độ trễ < 1s.
      parameters:
        - name: min_lat
          in: query
          required: true
          schema:
            type: number
            format: float
          example: 10.7000
        - name: max_lat
          in: query
          required: true
          schema:
            type: number
            format: float
          example: 10.9000
        - name: min_lng
          in: query
          required: true
          schema:
            type: number
            format: float
          example: 106.6000
        - name: max_lng
          in: query
          required: true
          schema:
            type: number
            format: float
          example: 106.8000
        - name: status
          in: query
          schema:
            type: string
            enum: [ALL, ONLINE, BUSY]
            default: ALL
        - name: vehicle_type
          in: query
          schema:
            type: string
            enum: [ALL, BIKE, CAR_4, CAR_7]
            default: ALL
      responses:
        '200':
          description: Danh sách vị trí các tài xế trong khung nhìn bản đồ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LiveDriverLocation'

  /live-map/active-trips:
    get:
      tags:
        - Live Operations Map
      summary: Danh sách tất cả chuyến xe đang diễn ra trên toàn hệ thống (SR_23)
      description: Lấy danh sách các chuyến đi ở trạng thái `ACCEPTED`, `ARRIVED`, hoặc `IN_TRIP`.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ALL, ACCEPTED, ARRIVED, IN_TRIP]
            default: ALL
      responses:
        '200':
          description: Danh sách chuyến xe đang hoạt động
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActiveTripItem'

  # =========================================================================
  # INCIDENT MANAGEMENT & INTERVENTION
  # =========================================================================
  /incidents:
    get:
      tags:
        - Incident Management & Intervention
      summary: Lấy danh sách các sự cố & cảnh báo bất thường (SR_24)
      description: |
        Hệ thống tự động phát hiện và cảnh báo các trường hợp:
        - Xe dừng yên bất thường > 5 phút khi đang ở trạng thái `IN_TRIP`.
        - Mất tín hiệu GPS tài xế > 5 phút.
        - Khách hàng bấm nút Báo cáo Sự cố khẩn cấp (SOS).
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, IN_PROGRESS, RESOLVED]
            default: OPEN
      responses:
        '200':
          description: Danh sách các sự cố cần xử lý
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncidentItem'

  /trips/{trip_id}/force-cancel:
    post:
      tags:
        - Incident Management & Intervention
      summary: Can thiệp Hủy chuyến xe cưỡng bức (SR_24, BRULE_10)
      description: |
        Nhân viên vận hành can thiệp hủy chuyến trong trường hợp khẩn cấp (tai nạn, tài xế không liên lạc được).
        - **Bắt buộc nhập lý do tối thiểu 10 ký tự**.
        - Hệ thống tự động ghi nhật ký vào bảng `AUDIT_LOGS` bất biến (SR_25).
        - Đưa trạng thái chuyến đi thành `CANCELLED`.
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 10
                  example: "Xe tài xế gặp sự cố chết máy trên đường đón, khách hàng yêu cầu hủy gấp."
                waive_penalty_fees:
                  type: boolean
                  description: Miễn toàn bộ phí phạt hủy cho các bên
                  default: true
      responses:
        '200':
          description: Hủy chuyến cưỡng bức thành công, đã lưu vết Audit Log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorActionResponse'
        '400':
          description: Lý do hủy không hợp lệ (dưới 10 ký tự) theo BRULE_10
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /trips/{trip_id}/reassign-driver:
    post:
      tags:
        - Incident Management & Intervention
      summary: Điều phối tài xế thay thế cứu hộ thủ công (SR_24, UC-11, BRULE_10)
      description: |
        Nhân viên vận hành chỉ định một tài xế cụ thể thay thế cho chuyến đi đang gặp sự cố.
        - **Bắt buộc nhập lý do tối thiểu 10 ký tự**.
        - Tự động ghi vết vào bảng `AUDIT_LOGS`.
        - Tài xế cũ được giải phóng khỏi cuốc xe, tài xế mới nhận được lệnh điều phối cứu hộ.
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - new_driver_id
                - reason
              properties:
                new_driver_id:
                  type: string
                  format: uuid
                  example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                reason:
                  type: string
                  minLength: 10
                  example: "Tài xế ban đầu thủng lốp, điều phối tài xế cứu hộ cách đó 300m."
      responses:
        '200':
          description: Điều phối tài xế thay thế thành công, đã ghi nhật ký kiểm toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorActionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /incidents/{incident_id}/resolve:
    post:
      tags:
        - Incident Management & Intervention
      summary: Đóng sự cố và cập nhật phương án xử lý (SR_24)
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resolution_notes
              properties:
                resolution_notes:
                  type: string
                  minLength: 10
                  example: "Đã liên hệ tài xế qua điện thoại, sự cố do tín hiệu GPS yếu trong hầm gửi xe, xe đã tiếp tục di chuyển."
      responses:
        '200':
          description: Đã giải quyết và đóng sự cố thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  incident_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: "RESOLVED"
                  resolved_at:
                    type: string
                    format: date-time

  # =========================================================================
  # TRIP INSPECTION & SUPPORT
  # =========================================================================
  /trips:
    get:
      tags:
        - Trip Inspection & Support
      summary: Tra cứu danh sách chuyến xe phục vụ hỗ trợ tổng đài (SR_14)
      description: Tìm kiếm chuyến xe theo mã chuyến, số điện thoại khách/tài xế, ngày tạo hoặc trạng thái.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: phone_number
          in: query
          schema:
            type: string
            example: "0912345678"
        - name: status
          in: query
          schema:
            type: string
            enum: [ALL, CREATED, ACCEPTED, ARRIVED, IN_TRIP, COMPLETED, PAID, CANCELLED]
      responses:
        '200':
          description: Danh sách kết quả tra cứu chuyến xe
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 120
                  trips:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActiveTripItem'

  /trips/{trip_id}:
    get:
      tags:
        - Trip Inspection & Support
      summary: Chi tiết toàn bộ chuyến xe và lịch sử can thiệp (SR_14, SR_25)
      description: Hiển thị đầy đủ thông tin khách hàng, tài xế, lộ trình GPS, trạng thái thanh toán và nhật ký kiểm toán liên quan.
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thông tin chi tiết chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailForOperator'
        '404':
          $ref: '#/components/responses/NotFoundError'

# ===========================================================================
# COMPONENTS SCHEMAS & RESPONSES
# ===========================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nhập JWT Token với quyền OPERATOR hoặc ADMIN.

  responses:
    BadRequestError:
      description: Dữ liệu gửi lên không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Thiếu JWT Token hoặc Token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Không tìm thấy tài nguyên yêu cầu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required:
        - error_code
        - message
        - timestamp
      properties:
        error_code:
          type: string
          example: "AUDIT_REASON_REQUIRED"
        message:
          type: string
          example: "Bắt buộc nhập lý do can thiệp tối thiểu 10 ký tự theo quy định kiểm toán BRULE_10."
        timestamp:
          type: string
          format: date-time

    OperatorAuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          example: 28800
        operator:
          $ref: '#/components/schemas/OperatorProfile'

    OperatorProfile:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
          example: "Lê Thị Vận Hành"
        email:
          type: string
          example: "operator01@cabsystem.vn"
        role:
          type: string
          example: "OPERATOR"
        shift_started_at:
          type: string
          format: date-time

    LiveDriverLocation:
      type: object
      properties:
        driver_id:
          type: string
          format: uuid
        driver_name:
          type: string
          example: "Trần Văn Bình"
        phone_number:
          type: string
          example: "0987654321"
        activity_status:
          type: string
          enum: [ONLINE, BUSY]
          example: "ONLINE"
        vehicle_type:
          type: string
          example: "CAR_4"
        license_plate:
          type: string
          example: "59A-123.45"
        latitude:
          type: number
          format: float
          example: 10.8225
        longitude:
          type: number
          format: float
          example: 106.6878
        speed:
          type: number
          example: 30.5
        last_ping_seconds_ago:
          type: integer
          example: 2

    ActiveTripItem:
      type: object
      properties:
        trip_id:
          type: string
          format: uuid
        customer_name:
          type: string
          example: "Nguyễn Văn An"
        customer_phone:
          type: string
          example: "0912345678"
        driver_name:
          type: string
          example: "Trần Văn Bình"
        driver_phone:
          type: string
          example: "0987654321"
        vehicle_type:
          type: string
          example: "CAR_4"
        license_plate:
          type: string
          example: "59A-123.45"
        status:
          type: string
          enum: [CREATED, ACCEPTED, ARRIVED, IN_TRIP, COMPLETED, PAID, CANCELLED]
          example: "IN_TRIP"
        pickup_address:
          type: string
          example: "12 Nguyễn Văn Bảo, Gò Vấp"
        dropoff_address:
          type: string
          example: "Chợ Bến Thành, Quận 1"
        estimated_fare:
          type: number
          example: 106000.0
        elapsed_minutes:
          type: integer
          example: 14

    IncidentItem:
      type: object
      properties:
        incident_id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        incident_type:
          type: string
          enum: [STATIONARY_OVER_5_MINS, GPS_LOST, PASSENGER_SOS, ROUTE_DEVIATION]
          example: "STATIONARY_OVER_5_MINS"
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
          example: "HIGH"
        description:
          type: string
          example: "Xe 59A-123.45 đứng yên hơn 6 phút tại đường Phan Văn Trị khi đang chở khách."
        detected_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, RESOLVED]
          example: "OPEN"

    OperatorActionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        trip_id:
          type: string
          format: uuid
        action:
          type: string
          example: "FORCE_CANCEL"
        audit_log_id:
          type: string
          format: uuid
          example: "f7e6d5c4-b3a2-1098-7654-3210fedcba98"
        performed_by:
          type: string
          example: "Lê Thị Vận Hành"
        message:
          type: string
          example: "Thao tác can thiệp đã được thực thi và ghi vào nhật ký kiểm toán AUDIT_LOGS."

    TripDetailForOperator:
      type: object
      properties:
        trip_id:
          type: string
          format: uuid
        customer:
          type: object
          properties:
            customer_id:
              type: string
              format: uuid
            full_name:
              type: string
            phone_number:
              type: string
        driver:
          type: object
          properties:
            driver_id:
              type: string
              format: uuid
            full_name:
              type: string
            phone_number:
              type: string
            license_number:
              type: string
        vehicle:
          type: object
          properties:
            license_plate:
              type: string
            vehicle_type:
              type: string
            brand_model:
              type: string
        trip_status:
          type: string
        pickup_address:
          type: string
        dropoff_address:
          type: string
        pickup_coordinates:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
        dropoff_coordinates:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
        estimated_fare:
          type: number
        actual_fare:
          type: number
        payment:
          type: object
          properties:
            method:
              type: string
            status:
              type: string
        audit_trail:
          type: array
          items:
            type: object
            properties:
              log_id:
                type: string
                format: uuid
              action:
                type: string
              performed_by:
                type: string
              details:
                type: string
              performed_at:
                type: string
                format: date-time
