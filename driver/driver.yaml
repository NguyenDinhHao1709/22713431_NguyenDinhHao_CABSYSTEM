openapi: 3.0.3
info:
  title: CAB System - Driver API Specification
  description: |
    Đặc tả API dành riêng cho phân hệ **Tài xế (Driver)** của hệ thống Đặt xe trực tuyến CAB System.
    Ánh xạ đầy đủ các yêu cầu từ tài liệu SRS:
    - **Business Requirements (BR):** BR_01 (Điều phối & Ghép xe), BR_02 (Live Tracking), BR_03 (Thanh toán & Thu tiền mặt), BR_05 (Phân quyền RBAC), BR_06 (Điểm uy tín), BR_07 (Thông báo tức thời), BR_10 (Bảo mật thông tin).
    - **Service Requirements (SR):** SR_01 (Nộp hồ sơ tài xế), SR_02 (Đăng nhập JWT), SR_03 (Quản lý hồ sơ xe), SR_04 (Bật/tắt Online), SR_05 (Phát sóng GPS 1-3s), SR_10 (Xử lý mời cuốc trong 15s), SR_11 (Hủy chuyến), SR_12 (Cập nhật mốc tiến trình), SR_14 (Tra cứu lịch sử), SR_15 (Quyết toán cước thực tế), SR_16 (Xác nhận thu tiền mặt), SR_20 (Xem điểm uy tín), SR_22 (Thông báo cuốc mới).
    - **Use Cases (UC):** UC-06 (Bật/tắt trạng thái làm việc), UC-07 (Tiếp nhận / Từ chối chuyến xe), UC-08 (Cập nhật tiến trình hành trình), UC-09 (Xác nhận thu tiền mặt), một phần UC-03 (Hủy chuyến).
    - **Business Rules (BRULE):** BRULE_01 (Điều kiện xe Online), BRULE_02 (Timeout phản hồi 15s), BRULE_05 (Chính sách hủy cuốc của tài xế), BRULE_06 (Duyệt bằng lái xe & kiểm tra rating < 3.8 / < 3.5), BRULE_07 (Saga bù trừ thu tiền mặt khi cổng lỗi).
  version: 1.0.0
  contact:
    name: Nguyễn Đình Hảo (MSSV: 22713431)
    url: https://github.com/NguyenDinhHao1709/22713431_NguyenDinhHao_CABSYSTEM.git

servers:
  - url: https://api.cabsystem.vn/api/v1/driver
    description: Production Server
  - url: http://localhost:8080/api/v1/driver
    description: Local Development & Sandbox Server

security:
  - bearerAuth: []

tags:
  - name: Authentication & Onboarding
    description: Đăng ký hồ sơ tài xế, đăng nhập, nộp giấy tờ bằng lái và phương tiện (SR_01, SR_02, SR_03)
  - name: Status & Location Telemetry
    description: Bật/Tắt trạng thái làm việc (Online/Offline) và định kỳ phát sóng tọa độ GPS 1-3s (SR_04, SR_05, UC-06)
  - name: Dispatch & Offer Handling
    description: Nhận thông báo mời cuốc và phản hồi Chấp nhận/Từ chối trong vòng 15 giây (SR_10, UC-07, BRULE_02)
  - name: Trip Execution & Progress
    description: Cập nhật các mốc tiến trình hành trình (ARRIVED -> IN_TRIP -> COMPLETED) và hủy cuốc (SR_11, SR_12, UC-08)
  - name: Fare & Cash Collection
    description: Xem chi tiết cước thực tế và xác nhận đã thu tiền mặt từ khách (SR_15, SR_16, UC-09)
  - name: Earnings & Reputation
    description: Thống kê thu nhập, lịch sử cuốc xe và xem điểm sao tín nhiệm (SR_14, SR_20, BRULE_06)
  - name: Notifications
    description: Nhận thông báo chuyến mới, lệnh hủy chuyến và cảnh báo từ hệ thống (SR_22)

paths:
  # =========================================================================
  # AUTHENTICATION & ONBOARDING
  # =========================================================================
  /auth/register:
    post:
      tags:
        - Authentication & Onboarding
      summary: Đăng ký tài khoản tài xế & nộp hồ sơ (SR_01, BRULE_06)
      description: |
        Tài xế đăng ký tài khoản, nộp số CCCD, giấy phép lái xe (hạng A1/B2/C có thời hạn > 6 tháng).
        Tài khoản được khởi tạo với trạng thái `PENDING_APPROVAL` chờ Quản trị viên duyệt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRegisterRequest'
      responses:
        '201':
          description: Nộp hồ sơ thành công, chờ Ban quản trị xét duyệt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          description: Số điện thoại, CCCD hoặc Giấy phép lái xe đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Authentication & Onboarding
      summary: Đăng nhập tài xế & Cấp JWT Token (SR_02)
      description: Xác thực tài xế bằng số điện thoại và mật khẩu. Chỉ tài xế đã được phê duyệt (`is_approved = true`) và không bị khóa mới được cấp Token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone_number
                - password
              properties:
                phone_number:
                  type: string
                  example: "0987654321"
                password:
                  type: string
                  format: password
                  example: "DriverPass@123"
      responses:
        '200':
          description: Đăng nhập thành công, trả về Access/Refresh Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverAuthTokenResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Tài khoản đang chờ phê duyệt hoặc đã bị đình chỉ/khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /profile:
    get:
      tags:
        - Authentication & Onboarding
      summary: Xem thông tin hồ sơ tài xế và trạng thái duyệt
      description: Lấy thông tin cá nhân, bằng lái, trạng thái hoạt động và tỷ lệ đánh giá sao trung bình.
      responses:
        '200':
          description: Chi tiết hồ sơ tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /vehicle:
    get:
      tags:
        - Authentication & Onboarding
      summary: Xem thông tin phương tiện hiện tại (SR_03)
      responses:
        '200':
          description: Thông tin phương tiện đã đăng ký
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleDetail'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags:
        - Authentication & Onboarding
      summary: Đăng ký phương tiện vận chuyển mới (SR_03)
      description: Nhập biển số xe, loại phương tiện (`BIKE`, `CAR_4`, `CAR_7`), hãng xe, màu sắc và giấy tờ đăng kiểm.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterVehicleRequest'
      responses:
        '201':
          description: Đăng ký xe thành công, chờ kiểm duyệt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleDetail'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          description: Biển số xe đã được đăng ký trên hệ thống
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =========================================================================
  # STATUS & LOCATION TELEMETRY
  # =========================================================================
  /status:
    patch:
      tags:
        - Status & Location Telemetry
      summary: Chuyển đổi trạng thái làm việc (SR_04, UC-06)
      description: |
        Tài xế chuyển đổi giữa các trạng thái:
        - `ONLINE`: Sẵn sàng nhận cuốc xe, được đưa vào Geo-Redis để ghép nối theo bán kính (BRULE_01).
        - `OFFLINE`: Nghỉ làm việc, rút khỏi danh sách tìm kiếm của hệ thống điều phối.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - activity_status
              properties:
                activity_status:
                  type: string
                  enum: [ONLINE, OFFLINE]
                  example: "ONLINE"
      responses:
        '200':
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  driver_id:
                    type: string
                    format: uuid
                  activity_status:
                    type: string
                    example: "ONLINE"
                  updated_at:
                    type: string
                    format: date-time
        '400':
          description: Tài xế chưa có phương tiện được duyệt hoặc đang trong cuốc xe (BUSY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /location:
    post:
      tags:
        - Status & Location Telemetry
      summary: Phát sóng tọa độ GPS thời gian thực (SR_05)
      description: |
        Ứng dụng tài xế tự động gửi tọa độ GPS định kỳ mỗi 1–3 giây.
        Dữ liệu được lập chỉ mục Geo-Index trên Redis Cache để phục vụ thuật toán quét bán kính và phát Live Tracking tới Khách hàng.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverLocationPayload'
      responses:
        '200':
          description: Tọa độ đã được cập nhật vào Redis Cache
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledged:
                    type: boolean
                    example: true
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequestError'

  # =========================================================================
  # DISPATCH & OFFER HANDLING
  # =========================================================================
  /offers/{trip_id}/accept:
    post:
      tags:
        - Dispatch & Offer Handling
      summary: Tiếp nhận chuyến xe được điều phối (SR_10, UC-07, BRULE_02)
      description: |
        Tài xế bấm Chấp nhận lời mời cuốc xe trong vòng đếm ngược **15 giây**.
        - Hệ thống gán `driver_id` vào chuyến đi, chuyển trạng thái chuyến sang `ACCEPTED`.
        - Tài xế được chuyển trạng thái sang `BUSY`.
        - Gửi thông báo xác nhận kèm biển số xe tới Khách hàng.
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Nhận cuốc xe thành công, bắt đầu di chuyển tới điểm đón
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverAssignedTripResponse'
        '408':
          description: Đã hết thời gian 15 giây (Timeout). Cuốc xe đã được chuyển tiếp sang tài xế khác.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Cuốc xe đã bị khách hàng hủy hoặc đã được tài xế khác nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /offers/{trip_id}/reject:
    post:
      tags:
        - Dispatch & Offer Handling
      summary: Từ chối chuyến xe được điều phối (SR_10, UC-07)
      description: |
        Tài xế bấm Từ chối cuốc xe. Hệ thống ghi nhận lượt từ chối và **tự động chuyển tiếp**
        lời mời sang tài xế có thứ hạng tiếp theo trong danh sách ưu tiên.
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: "Kẹt xe không kịp đến điểm đón"
      responses:
        '200':
          description: Ghi nhận từ chối cuốc xe thành công, hệ thống tự động điều phối tài xế khác
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Đã từ chối chuyến xe. Hệ thống chuyển tiếp cho tài xế kế tiếp."

  # =========================================================================
  # TRIP EXECUTION & PROGRESS
  # =========================================================================
  /trips/{trip_id}/progress:
    patch:
      tags:
        - Trip Execution & Progress
      summary: Cập nhật mốc trạng thái hành trình chuyến đi (SR_12, UC-08)
      description: |
        Tài xế thực hiện tuần tự chuyển đổi mốc trạng thái theo máy trạng thái:
        - `ARRIVED`: Đã đến điểm đón khách.
        - `IN_TRIP`: Khách đã lên xe, bắt đầu chở đến điểm đến.
        - `COMPLETED`: Đã chở khách đến điểm trả an toàn. Hệ thống tự động tính cước thực tế (SR_15).
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target_status
              properties:
                target_status:
                  type: string
                  enum: [ARRIVED, IN_TRIP, COMPLETED]
                  example: "ARRIVED"
                current_lat:
                  type: number
                  format: float
                  example: 10.8223
                current_lng:
                  type: number
                  format: float
                  example: 106.6875
      responses:
        '200':
          description: Chuyển mốc trạng thái chuyến đi thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripProgressResponse'
        '400':
          description: Trạng thái chuyển đổi không hợp lệ theo máy trạng thái
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /trips/{trip_id}/cancel:
    post:
      tags:
        - Trip Execution & Progress
      summary: Tài xế yêu cầu hủy chuyến (SR_11, BRULE_05)
      description: |
        Tài xế hủy chuyến xe (ví dụ: đã đợi quá 5 phút mà khách không ra).
        Nếu tự ý hủy > 2 lần/ngày không có lý do hợp lệ sẽ bị tạm khóa tài khoản 24 giờ và trừ điểm uy tín theo BRULE_05.
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  example: "Khách hàng không xuất hiện sau 5 phút chờ đón"
      responses:
        '200':
          description: Hủy chuyến thành công, tài xế được chuyển về trạng thái ONLINE
          content:
            application/json:
              schema:
                type: object
                properties:
                  trip_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: "CANCELLED"
                  penalty_applied:
                    type: boolean
                    example: false
        '400':
          $ref: '#/components/responses/BadRequestError'

  # =========================================================================
  # FARE & CASH COLLECTION
  # =========================================================================
  /trips/{trip_id}/fare-summary:
    get:
      tags:
        - Fare & Cash Collection
      summary: Xem chi tiết cước phí thực tế sau khi hoàn thành (SR_15)
      description: Trả về thông tin cước phí chốt sau chuyến đi, phương thức thanh toán của khách và số tiền tài xế cần thu (nếu là Tiền mặt).
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thông tin cước phí và hình thức thanh toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FareSummaryResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /trips/{trip_id}/confirm-cash-collected:
    post:
      tags:
        - Fare & Cash Collection
      summary: Xác nhận đã thu đủ tiền mặt từ khách (SR_16, UC-09)
      description: |
        Sau khi khách thanh toán bằng tiền mặt (hoặc sau khi Saga bù trừ từ lỗi cổng thanh toán điện tử sang tiền mặt theo BRULE_07),
        tài xế bấm nút xác nhận "Đã thu tiền".
        - Chuyến đi chuyển trạng thái sang `PAID`.
        - Tài xế được chuyển lại trạng thái `ONLINE` để tiếp tục nhận cuốc mới.
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount_collected
              properties:
                amount_collected:
                  type: number
                  description: Số tiền thực tế đã thu từ khách hàng (VNĐ)
                  example: 106000.0
      responses:
        '200':
          description: Đã xác nhận thu tiền mặt thành công. Chuyến đi chuyển sang PAID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  trip_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: "PAID"
                  payment_status:
                    type: string
                    example: "SUCCESS"
                  driver_status:
                    type: string
                    example: "ONLINE"
        '400':
          description: Chuyến đi chưa ở trạng thái COMPLETED hoặc phương thức không phải là Tiền mặt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =========================================================================
  # EARNINGS & REPUTATION
  # =========================================================================
  /trips:
    get:
      tags:
        - Earnings & Reputation
      summary: Lịch sử các chuyến đi của tài xế (SR_14)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: date
          in: query
          description: Lọc theo ngày (định dạng YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-09-13"
      responses:
        '200':
          description: Danh sách lịch sử các chuyến đi
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 48
                  trips:
                    type: array
                    items:
                      $ref: '#/components/schemas/DriverTripItem'

  /earnings:
    get:
      tags:
        - Earnings & Reputation
      summary: Thống kê thu nhập của tài xế
      description: Xem tổng tiền cước thu được, số lượng chuyến chạy thành công theo ngày, tuần hoặc tháng.
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [DAILY, WEEKLY, MONTHLY]
            default: DAILY
      responses:
        '200':
          description: Báo cáo thu nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EarningsReport'

  /reputation:
    get:
      tags:
        - Earnings & Reputation
      summary: Xem điểm uy tín & số sao đánh giá (SR_20, BRULE_06)
      description: |
        Hiển thị điểm đánh giá sao trung bình (`rating_average`), tỷ lệ nhận cuốc (`acceptance_rate`),
        và cảnh báo nếu rating < 3.8 sao theo quy định BRULE_06.
      responses:
        '200':
          description: Thông tin điểm tín nhiệm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReputationReport'

  # =========================================================================
  # NOTIFICATIONS
  # =========================================================================
  /notifications:
    get:
      tags:
        - Notifications
      summary: Danh sách thông báo đẩy gửi đến Tài xế (SR_22)
      description: Nhận thông báo mời cuốc mới, thông báo khách hủy chuyến và nhắc nhở chính sách.
      responses:
        '200':
          description: Danh sách thông báo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriverNotificationItem'

# ===========================================================================
# COMPONENTS SCHEMAS & RESPONSES
# ===========================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nhập JWT Token với quyền DRIVER (cấp từ /auth/login).

  responses:
    BadRequestError:
      description: Dữ liệu gửi lên không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Thiếu JWT Token hoặc Token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Không tìm thấy tài nguyên yêu cầu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required:
        - error_code
        - message
        - timestamp
      properties:
        error_code:
          type: string
          example: "INVALID_STATUS_TRANSITION"
        message:
          type: string
          example: "Không thể chuyển trạng thái từ CREATED sang IN_TRIP trực tiếp."
        timestamp:
          type: string
          format: date-time
          example: "2026-09-13T09:15:00Z"

    DriverRegisterRequest:
      type: object
      required:
        - phone_number
        - full_name
        - password
        - id_card_number
        - license_number
        - license_class
      properties:
        phone_number:
          type: string
          example: "0987654321"
        full_name:
          type: string
          example: "Trần Văn Bình"
        password:
          type: string
          format: password
          minLength: 8
          example: "DriverPass@123"
        email:
          type: string
          format: email
          example: "vanbinh.driver@example.com"
        id_card_number:
          type: string
          description: Số CCCD 12 số
          example: "079099012345"
        license_number:
          type: string
          description: Số giấy phép lái xe
          example: "790123456789"
        license_class:
          type: string
          enum: [A1, B2, C]
          example: "B2"
        license_expiry_date:
          type: string
          format: date
          description: Thời hạn còn lại phải trên 6 tháng theo BRULE_06
          example: "2028-12-31"

    DriverRegistrationResponse:
      type: object
      properties:
        driver_id:
          type: string
          format: uuid
        full_name:
          type: string
          example: "Trần Văn Bình"
        approval_status:
          type: string
          example: "PENDING_APPROVAL"
        message:
          type: string
          example: "Hồ sơ của bạn đã được ghi nhận và đang chờ Quản trị viên xét duyệt bằng lái xe."

    DriverAuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          example: 86400
        driver:
          $ref: '#/components/schemas/DriverProfile'

    DriverProfile:
      type: object
      properties:
        driver_id:
          type: string
          format: uuid
        full_name:
          type: string
          example: "Trần Văn Bình"
        phone_number:
          type: string
          example: "0987654321"
        license_number:
          type: string
          example: "790123456789"
        license_class:
          type: string
          example: "B2"
        rating_average:
          type: number
          format: float
          example: 4.88
        total_trips:
          type: integer
          example: 156
        activity_status:
          type: string
          enum: [ONLINE, BUSY, OFFLINE]
          example: "ONLINE"
        is_approved:
          type: boolean
          example: true

    RegisterVehicleRequest:
      type: object
      required:
        - license_plate
        - vehicle_type
        - brand_model
        - color
      properties:
        license_plate:
          type: string
          example: "59A-123.45"
        vehicle_type:
          type: string
          enum: [BIKE, CAR_4, CAR_7]
          example: "CAR_4"
        brand_model:
          type: string
          example: "Toyota Vios 2022"
        color:
          type: string
          example: "Trắng"

    VehicleDetail:
      type: object
      properties:
        vehicle_id:
          type: string
          format: uuid
        driver_id:
          type: string
          format: uuid
        license_plate:
          type: string
          example: "59A-123.45"
        vehicle_type:
          type: string
          example: "CAR_4"
        brand_model:
          type: string
          example: "Toyota Vios 2022"
        color:
          type: string
          example: "Trắng"
        is_active:
          type: boolean
          example: true

    DriverLocationPayload:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: float
          example: 10.8225
        longitude:
          type: number
          format: float
          example: 106.6878
        speed:
          type: number
          format: float
          description: Tốc độ hiện tại (km/h)
          example: 32.5
        heading:
          type: number
          format: float
          description: Góc hướng di chuyển (0 - 360 độ)
          example: 120.0

    DriverAssignedTripResponse:
      type: object
      properties:
        trip_id:
          type: string
          format: uuid
        status:
          type: string
          example: "ACCEPTED"
        pickup_address:
          type: string
          example: "12 Nguyễn Văn Bảo, Phường 4, Gò Vấp"
        pickup_lat:
          type: number
          example: 10.8223
        pickup_lng:
          type: number
          example: 106.6875
        dropoff_address:
          type: string
          example: "Chợ Bến Thành, Quận 1"
        dropoff_lat:
          type: number
          example: 10.7725
        dropoff_lng:
          type: number
          example: 106.6980
        customer:
          type: object
          properties:
            customer_id:
              type: string
              format: uuid
            full_name:
              type: string
              example: "Nguyễn Văn An"
            phone_number:
              type: string
              description: Đã che 4 chữ số giữa theo BRULE_08
              example: "091****678"
        estimated_fare:
          type: number
          example: 106000.0
        payment_method:
          type: string
          example: "DIGITAL_WALLET"

    TripProgressResponse:
      type: object
      properties:
        trip_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ARRIVED, IN_TRIP, COMPLETED]
          example: "ARRIVED"
        updated_at:
          type: string
          format: date-time
          example: "2026-09-13T09:20:00Z"

    FareSummaryResponse:
      type: object
      properties:
        trip_id:
          type: string
          format: uuid
        distance_km:
          type: number
          example: 7.8
        duration_minutes:
          type: integer
          example: 24
        actual_fare:
          type: number
          example: 109000.0
        payment_method:
          type: string
          enum: [CASH, DIGITAL_WALLET, CREDIT_CARD]
          example: "CASH"
        payment_status:
          type: string
          enum: [PENDING, SUCCESS, COMPENSATED_CASH]
          example: "PENDING"
        amount_to_collect:
          type: number
          description: Số tiền mặt tài xế cần thu trực tiếp từ khách
          example: 109000.0
        is_compensated:
          type: boolean
          description: Cảnh báo nếu giao dịch vừa được Saga bù trừ sang Tiền mặt (BRULE_07)
          example: false

    DriverTripItem:
      type: object
      properties:
        trip_id:
          type: string
          format: uuid
        pickup_address:
          type: string
        dropoff_address:
          type: string
        actual_fare:
          type: number
          example: 109000.0
        driver_earnings:
          type: number
          description: Số tiền thực nhận sau chiết khấu sàn
          example: 87200.0
        payment_method:
          type: string
        completed_at:
          type: string
          format: date-time

    EarningsReport:
      type: object
      properties:
        period:
          type: string
          example: "DAILY"
        date:
          type: string
          example: "2026-09-13"
        total_trips_completed:
          type: integer
          example: 12
        gross_revenue:
          type: number
          example: 1250000.0
        net_income:
          type: number
          example: 1000000.0
        cash_collected:
          type: number
          example: 450000.0
        digital_settled:
          type: number
          example: 800000.0

    ReputationReport:
      type: object
      properties:
        driver_id:
          type: string
          format: uuid
        rating_average:
          type: number
          format: float
          example: 4.88
        total_reviews:
          type: integer
          example: 140
        acceptance_rate:
          type: number
          format: float
          description: Tỷ lệ nhận cuốc thành công
          example: 0.94
        cancellation_rate:
          type: number
          format: float
          description: Tỷ lệ tự ý hủy cuốc
          example: 0.02
        warning_status:
          type: string
          description: Cảnh báo theo BRULE_06 (NORMAL, WARNING_BELOW_3_8, SUSPENDED_BELOW_3_5)
          example: "NORMAL"

    DriverNotificationItem:
      type: object
      properties:
        notification_id:
          type: string
          format: uuid
        title:
          type: string
          example: "Có cuốc xe mới gần bạn!"
        message:
          type: string
          example: "Đón khách tại 12 Nguyễn Văn Bảo (cách bạn 450m). Giá cước tạm tính 106.000đ."
        trip_id:
          type: string
          format: uuid
        timeout_seconds:
          type: integer
          description: Thời gian đếm ngược còn lại (tối đa 15s)
          example: 15
        sent_at:
          type: string
          format: date-time
