openapi: 3.0.3
info:
  title: CAB System - Admin API Specification
  description: |
    Đặc tả API dành riêng cho phân hệ **Quản trị viên Hệ thống (Admin)** của hệ thống Đặt xe trực tuyến CAB System.
    Ánh xạ đầy đủ các yêu cầu từ tài liệu SRS:
    - **Business Requirements (BR):** BR_04 (Giám sát & báo cáo doanh thu), BR_05 (Phân quyền RBAC & quản trị người dùng), BR_06 (Kiểm duyệt chất lượng & xử lý tài xế rating thấp), BR_08 (Tính sẵn sàng), BR_10 (Nhật ký kiểm toán Audit Log & bảo mật đa tầng).
    - **Service Requirements (SR):** SR_01 (Duyệt hồ sơ tài xế), SR_02 (Xác thực JWT Role ADMIN), SR_03 (Duyệt phương tiện), SR_14 (Tra cứu chuyến đi toàn hệ thống), SR_15 (Doanh thu), SR_17 (Đối soát cổng thanh toán), SR_20 (Quản lý điểm tín nhiệm tài xế), SR_25 (Báo cáo Dashboard & tra cứu Audit Logs).
    - **Use Cases (UC):** UC-12 (Kiểm duyệt hồ sơ tài xế & phương tiện), UC-13 (Báo cáo thống kê & doanh thu), Quản trị người dùng & cấu hình biểu phí.
    - **Business Rules (BRULE):** BRULE_03 (Cấu hình bảng cước phí chuẩn), BRULE_04 (Hệ số cao điểm và ban đêm), BRULE_06 (Tiêu chuẩn duyệt bằng lái > 6 tháng, xử phạt rating < 3.8 và đình chỉ < 3.5), BRULE_10 (Lưu vết 100% thao tác quản trị vào `AUDIT_LOGS` bất biến).
  version: 1.0.0
  contact:
    name: Nguyễn Đình Hảo (MSSV: 22713431)
    url: https://github.com/NguyenDinhHao1709/22713431_NguyenDinhHao_CABSYSTEM.git

servers:
  - url: https://api.cabsystem.vn/api/v1/admin
    description: Production Server
  - url: http://localhost:8080/api/v1/admin
    description: Local Development & Sandbox Server

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Đăng nhập quản trị viên hệ thống (SR_02)
  - name: User Management
    description: Quản lý người dùng, khóa/mở khóa tài khoản có ghi nhận Audit Log (BR_05, BRULE_10)
  - name: Driver & Vehicle Approval
    description: Xét duyệt hồ sơ đăng ký tài xế, kiểm tra bằng lái xe và phê duyệt phương tiện (SR_01, SR_03, UC-12, BRULE_06)
  - name: Driver Quality & Suspension
    description: Giám sát điểm đánh giá sao, gửi cảnh báo và đình chỉ tài xế vi phạm chất lượng (SR_20, BRULE_06)
  - name: Pricing Configuration
    description: Cấu hình bảng giá cước, giá mở cửa, đơn giá/km và hệ số cao điểm (BRULE_03, BRULE_04)
  - name: Analytics & Dashboard
    description: Báo cáo số lượng chuyến đi, tỷ lệ hoàn thành, thời gian ghép xe trung bình (SR_25, UC-13)
  - name: Financial & Settlements
    description: Thống kê tổng doanh thu, đối soát thanh toán tiền mặt vs ví điện tử (BR_03, SR_15, SR_17)
  - name: Audit Logs
    description: Truy vấn nhật ký kiểm toán bất biến các thao tác quản trị nhạy cảm (SR_25, BR_10, BRULE_10)

paths:
  # =========================================================================
  # AUTHENTICATION
  # =========================================================================
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Đăng nhập Quản trị viên (SR_02)
      description: Xác thực tài khoản Admin, cấp JWT Access Token có thời hạn và quyền quản trị cao nhất.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "admin@cabsystem.vn"
                password:
                  type: string
                  format: password
                  example: "SuperAdmin@Cab2026"
      responses:
        '200':
          description: Đăng nhập thành công, trả về Access Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthTokenResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Tài khoản không có quyền ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me:
    get:
      tags:
        - Authentication
      summary: Lấy thông tin tài khoản Admin đang đăng nhập
      responses:
        '200':
          description: Thông tin Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # =========================================================================
  # USER MANAGEMENT
  # =========================================================================
  /users:
    get:
      tags:
        - User Management
      summary: Danh sách người dùng hệ thống (Customer, Driver, Operator)
      description: Phân trang danh sách người dùng kèm bộ lọc theo vai trò (Role), trạng thái (ACTIVE, LOCKED, PENDING).
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: role
          in: query
          schema:
            type: string
            enum: [ALL, CUSTOMER, DRIVER, OPERATOR, ADMIN]
            default: ALL
        - name: status
          in: query
          schema:
            type: string
            enum: [ALL, ACTIVE, LOCKED, PENDING]
            default: ALL
        - name: search
          in: query
          description: Tìm theo số điện thoại, email hoặc họ tên
          schema:
            type: string
      responses:
        '200':
          description: Danh sách người dùng
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 1540
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserAdminView'

  /users/{user_id}/status:
    patch:
      tags:
        - User Management
      summary: Khóa hoặc Mở khóa tài khoản người dùng (BRULE_10)
      description: |
        Quản trị viên thay đổi trạng thái tài khoản (`ACTIVE` hoặc `LOCKED`).
        - **Bắt buộc nhập lý do tối thiểu 10 ký tự**.
        - Hệ thống tự động ghi nhật ký vào bảng `AUDIT_LOGS`.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
                - reason
              properties:
                status:
                  type: string
                  enum: [ACTIVE, LOCKED]
                  example: "LOCKED"
                reason:
                  type: string
                  minLength: 10
                  example: "Phát hiện hành vi gian lận điểm thưởng hoặc vi phạm chính sách an toàn."
      responses:
        '200':
          description: Cập nhật trạng thái người dùng thành công, đã lưu Audit Log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # =========================================================================
  # DRIVER & VEHICLE APPROVAL
  # =========================================================================
  /drivers/pending:
    get:
      tags:
        - Driver & Vehicle Approval
      summary: Danh sách hồ sơ tài xế chờ phê duyệt (SR_01, UC-12)
      description: Lấy danh sách tài xế mới đăng ký (`is_approved = false`) kèm giấy phép lái xe để xét duyệt.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách hồ sơ tài xế chờ duyệt
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingDriverDetail'

  /drivers/{driver_id}/approval:
    put:
      tags:
        - Driver & Vehicle Approval
      summary: Phê duyệt hoặc Từ chối hồ sơ tài xế (SR_03, UC-12, BRULE_06)
      description: |
        Quản trị viên thẩm định hồ sơ:
        - Bằng lái phải còn hạn > 6 tháng theo `BRULE_06`.
        - Nếu duyệt (`APPROVE`): `is_approved` chuyển sang `true`, tài xế được phép chuyển `ONLINE` đón khách.
        - Nếu từ chối (`REJECT`): Bắt buộc nêu rõ lý do để gửi thông báo cho tài xế nộp lại.
      parameters:
        - name: driver_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum: [APPROVE, REJECT]
                  example: "APPROVE"
                reason:
                  type: string
                  description: Bắt buộc nếu là REJECT
                  example: "Hồ sơ hợp lệ, bằng lái xe B2 còn hạn đến 2028."
      responses:
        '200':
          description: Xử lý hồ sơ tài xế thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /vehicles/pending:
    get:
      tags:
        - Driver & Vehicle Approval
      summary: Danh sách phương tiện chờ duyệt biển số & đăng kiểm (SR_03)
      responses:
        '200':
          description: Danh sách xe chờ kiểm định
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingVehicleItem'

  /vehicles/{vehicle_id}/approval:
    put:
      tags:
        - Driver & Vehicle Approval
      summary: Phê duyệt hoặc Từ chối phương tiện (SR_03)
      parameters:
        - name: vehicle_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum: [APPROVE, REJECT]
                  example: "APPROVE"
                reason:
                  type: string
                  example: "Xe Toyota Vios 59A-123.45 đạt tiêu chuẩn an toàn kỹ thuật."
      responses:
        '200':
          description: Phê duyệt xe thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'

  # =========================================================================
  # DRIVER QUALITY & SUSPENSION
  # =========================================================================
  /drivers/low-rating:
    get:
      tags:
        - Driver Quality & Suspension
      summary: Danh sách tài xế có điểm đánh giá uy tín thấp (SR_20, BRULE_06)
      description: |
        Truy vấn các tài xế cần theo dõi chất lượng theo quy tắc `BRULE_06`:
        - `rating_average < 3.8` trong 30 chuyến gần nhất: Mức cảnh báo.
        - `rating_average < 3.5`: Mức tạm đình chỉ để đào tạo lại.
      parameters:
        - name: threshold
          in: query
          schema:
            type: number
            format: float
            default: 3.8
      responses:
        '200':
          description: Danh sách tài xế có nguy cơ vi phạm chuẩn chất lượng
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LowRatingDriverItem'

  /drivers/{driver_id}/suspend:
    post:
      tags:
        - Driver Quality & Suspension
      summary: Tạm đình chỉ hoạt động tài xế có điểm đánh giá thấp (BRULE_06, BRULE_10)
      description: Tạm đình chỉ tài xế không đạt chuẩn (< 3.5 sao), rút tài xế khỏi hệ thống điều phối và ghi nhận Audit Log.
      parameters:
        - name: driver_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 10
                  example: "Điểm đánh giá trung bình đạt 3.4 sao trong 30 chuyến gần nhất, tạm đình chỉ để đào tạo lại dịch vụ."
                suspension_days:
                  type: integer
                  default: 7
                  example: 7
      responses:
        '200':
          description: Đình chỉ tài xế thành công, đã cập nhật trạng thái và Audit Log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'

  # =========================================================================
  # PRICING CONFIGURATION
  # =========================================================================
  /pricing-config:
    get:
      tags:
        - Pricing Configuration
      summary: Xem cấu hình biểu phí chuẩn toàn hệ thống (BRULE_03, BRULE_04)
      description: Xem bảng cước mở cửa, giá mỗi km tiếp theo và hệ số cao điểm hiện hành.
      responses:
        '200':
          description: Cấu hình biểu phí
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPricingConfig'
    put:
      tags:
        - Pricing Configuration
      summary: Cập nhật cấu hình biểu phí hệ thống (BRULE_03, BRULE_04, BRULE_10)
      description: Điều chỉnh giá mở cửa, đơn giá/km từng loại phương tiện (`BIKE`, `CAR_4`, `CAR_7`) và hệ số phụ phí cao điểm. Thao tác được ghi vào Audit Log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePricingConfigRequest'
      responses:
        '200':
          description: Cập nhật biểu phí thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPricingConfig'
        '400':
          $ref: '#/components/responses/BadRequestError'

  # =========================================================================
  # ANALYTICS & DASHBOARD
  # =========================================================================
  /reports/dashboard:
    get:
      tags:
        - Analytics & Dashboard
      summary: Tổng quan số liệu thống kê Dashboard (SR_25, UC-13, BG_01, BG_04)
      description: |
        Cung cấp các chỉ số đo lường hiệu quả (KPIs) cốt lõi:
        - Tổng số chuyến đi, tỷ lệ hoàn thành (> 90%).
        - Thời gian ghép xe trung bình (< 30 giây theo BG_01).
        - Tổng số tài xế đang hoạt động (Online / Busy).
        - Biểu đồ phân bổ cuốc xe theo khung giờ cao điểm.
      parameters:
        - name: from_date
          in: query
          schema:
            type: string
            format: date
            example: "2026-09-01"
        - name: to_date
          in: query
          schema:
            type: string
            format: date
            example: "2026-09-13"
      responses:
        '200':
          description: Dữ liệu thống kê tổng quan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAnalyticsResponse'

  # =========================================================================
  # FINANCIAL & SETTLEMENTS
  # =========================================================================
  /finance/overview:
    get:
      tags:
        - Financial & Settlements
      summary: Báo cáo doanh thu & đối soát tài chính (BR_03, SR_15)
      description: Tổng hợp tổng giá trị giao dịch (GMV), doanh thu cước sàn thu, tỷ lệ tiền mặt so với thanh toán điện tử (Mục tiêu > 50% theo BG_03).
      parameters:
        - name: month
          in: query
          schema:
            type: string
            example: "2026-09"
      responses:
        '200':
          description: Báo cáo tài chính doanh thu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialOverviewResponse'

  /finance/transactions:
    get:
      tags:
        - Financial & Settlements
      summary: Danh sách giao dịch thanh toán và bù trừ Saga (SR_17, SR_18)
      description: Tra cứu chi tiết giao dịch cổng thanh toán VNPay/MoMo, phát hiện các giao dịch bị lỗi hoặc đã chuyển sang COMPENSATED_CASH.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: payment_status
          in: query
          schema:
            type: string
            enum: [ALL, SUCCESS, FAILED, COMPENSATED_CASH]
      responses:
        '200':
          description: Danh sách giao dịch
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionItem'

  # =========================================================================
  # AUDIT LOGS
  # =========================================================================
  /audit-logs:
    get:
      tags:
        - Audit Logs
      summary: Truy vấn nhật ký kiểm toán hệ thống bất biến (SR_25, BR_10, BRULE_10)
      description: |
        Tra cứu lịch sử 100% các thao tác quản trị và can thiệp nhạy cảm:
        - Khóa/mở khóa tài khoản người dùng (`LOCK_USER`).
        - Can thiệp hủy chuyến cưỡng bức (`FORCE_CANCEL`).
        - Điều phối tài xế thay thế (`REASSIGN_DRIVER`).
        - Thay đổi cấu hình biểu phí hệ thống (`UPDATE_PRICING`).
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
        - name: action
          in: query
          schema:
            type: string
            enum: [ALL, FORCE_CANCEL, REASSIGN_DRIVER, LOCK_USER, APPROVE_DRIVER, UPDATE_PRICING]
        - name: user_id
          in: query
          description: Lọc theo người thực hiện
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Danh sách nhật ký kiểm toán
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 320
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogItem'

# ===========================================================================
# COMPONENTS SCHEMAS & RESPONSES
# ===========================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nhập JWT Token với quyền ADMIN (cấp từ /auth/login).

  responses:
    BadRequestError:
      description: Tham số gửi lên không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Thiếu JWT Token hoặc Token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required:
        - error_code
        - message
        - timestamp
      properties:
        error_code:
          type: string
          example: "FORBIDDEN_OPERATION"
        message:
          type: string
          example: "Thao tác yêu cầu quyền Quản trị viên cấp cao (ADMIN)."
        timestamp:
          type: string
          format: date-time

    AdminAuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          example: 28800
        admin:
          $ref: '#/components/schemas/AdminProfile'

    AdminProfile:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
          example: "Nguyễn Đình Hảo"
        email:
          type: string
          example: "admin@cabsystem.vn"
        role:
          type: string
          example: "ADMIN"

    UserAdminView:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        phone_number:
          type: string
          example: "0912345678"
        email:
          type: string
          example: "user@example.com"
        full_name:
          type: string
          example: "Nguyễn Văn An"
        role:
          type: string
          enum: [CUSTOMER, DRIVER, OPERATOR, ADMIN]
          example: "CUSTOMER"
        status:
          type: string
          enum: [ACTIVE, LOCKED, PENDING]
          example: "ACTIVE"
        created_at:
          type: string
          format: date-time

    AdminActionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        target_id:
          type: string
          format: uuid
        action:
          type: string
          example: "LOCK_USER"
        audit_log_id:
          type: string
          format: uuid
        message:
          type: string
