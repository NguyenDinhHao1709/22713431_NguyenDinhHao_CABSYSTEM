                  example: 14000
                price_per_km:
                  type: number
                  example: 5000
            CAR_4:
              type: object
              properties:
                base_price:
                  type: number
                  example: 25000
                price_per_km:
                  type: number
                  example: 11500
            CAR_7:
              type: object
              properties:
                base_price:
                  type: number
